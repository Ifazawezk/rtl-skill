<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="rtl-check-expect" content="">
  <meta name="rtl-check-allow" content="">
  <title>fixture</title>
  <style>
    body { font: 16px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #1f2933; }
    main { max-width: 720px; margin: 0 auto; }
    .card { position: relative; background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; padding: 16px 20px; margin-block-end: 16px; }
    h1 { font-size: 24px; line-height: 1.4; margin-block: 0 16px; }
    h2 { font-size: 18px; margin-block: 0 8px; }
    p { margin: 0 0 8px; }
    table { border-collapse: collapse; inline-size: 100%; }
    th, td { text-align: start; padding: 8px 12px; border-block-end: 1px solid #e4e7eb; }
    label { display: block; margin-block: 12px 4px; }
    input { font: inherit; padding: 8px 12px; border: 1px solid #cbd2d9; border-radius: 6px; inline-size: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
<main>
  <h1>بيانات الدفع</h1>
  <form class="card">
    <label for="c">رقم الحساب</label><input id="iban" name="iban" type="text" dir="ltr">
    <label for="m">رقم الهاتف</label><input id="m" type="text" inputmode="tel" autocomplete="tel" dir="ltr">
  </form>
</main>
</body>
</html>
