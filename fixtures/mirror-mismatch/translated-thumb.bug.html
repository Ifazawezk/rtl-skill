<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="rtl-check-expect" content="mirror-mismatch">
  <meta name="rtl-check-allow" content="">
  <title>fixture</title>
  <style>
    body { font: 16px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #1f2933; }
    main { max-width: 720px; margin: 0 auto; }
    .card { position: relative; background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; padding: 16px 20px; margin-block-end: 16px; }
    h1 { font-size: 24px; line-height: 1.4; margin-block: 0 16px; }
    h2 { font-size: 18px; margin-block: 0 8px; }
    .track { position: relative; block-size: 6px; inline-size: 300px; background: #cbd2d9; border-radius: 999px; margin-block: 16px; }
    .thumb { position: absolute; inset-block-start: -7px; inset-inline-start: 0; inline-size: 20px; block-size: 20px; border-radius: 50%; background: #3e7bfa; transform: translateX(120px); }
  </style>
</head>
<body>
<main>
  <h1>الميزانية</h1>
  <div class="card">
    <p>حدد أعلى سعر تريد أن تراه في النتائج.</p>
    <div class="track"><span class="thumb" aria-hidden="true"></span></div>
  </div>
</main>
</body>
</html>
