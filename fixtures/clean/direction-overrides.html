<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>fixture</title>
  <style>
    body { font: 16px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #1f2933; }
    main { max-width: 720px; margin: 0 auto; }
    .card { position: relative; background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; padding: 16px 20px; margin-block-end: 16px; }
    h1 { font-size: 24px; line-height: 1.4; margin-block: 0 16px; }
    h2 { font-size: 18px; margin-block: 0 8px; }
    .icon { display: inline-block; inline-size: 12px; block-size: 12px; background: #3e7bfa; margin-right: 8px; }
    [dir="rtl"] .icon { margin-right: 0; margin-left: 8px; }
    .note { padding-left: 16px; border-left: 3px solid #3e7bfa; text-align: left; }
    :dir(rtl) .note { padding-left: 0; padding-right: 16px; border-left: 0; border-right: 3px solid #3e7bfa; text-align: right; }
    .pin { position: absolute; top: 8px; left: 8px; }
    [dir="rtl"] .pin { left: auto; right: 8px; }

  </style>
</head>
<body>
<main>
  <h1>تجاوزات حسب الاتجاه</h1>
  <div class="card"><span class="pin">جديد</span><p><span class="icon"></span>عنصر بأيقونة</p><p class="note">ملاحظة مهمة للعميل.</p></div>
</main>
</body>
</html>
