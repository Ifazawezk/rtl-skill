<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>fixture</title>
  <style>
    body { font: 16px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #1f2933; }
    main { max-width: 720px; margin: 0 auto; }
    .card { position: relative; background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; padding: 16px 20px; margin-block-end: 16px; }
    h1 { font-size: 24px; line-height: 1.4; margin-block: 0 16px; }
    h2 { font-size: 18px; margin-block: 0 8px; }
    .bar { block-size: 10px; background: #e4e7eb; border-radius: 999px; overflow: hidden; }
    .fill { block-size: 100%; background: #3ebd93; transform-origin: left; transform: scaleX(0.4); }
    [dir="rtl"] .fill { transform-origin: right; }

  </style>
</head>
<body>
<main>
  <h1>التقدم</h1>
  <div class="card"><p>تم إنجاز أربعين بالمئة.</p><div class="bar"><div class="fill"></div></div></div>
</main>
</body>
</html>
