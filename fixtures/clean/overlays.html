<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>fixture</title>
  <style>
    body { font: 16px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #1f2933; }
    main { max-width: 720px; margin: 0 auto; }
    .card { position: relative; background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; padding: 16px 20px; margin-block-end: 16px; }
    h1 { font-size: 24px; line-height: 1.4; margin-block: 0 16px; }
    h2 { font-size: 18px; margin-block: 0 8px; }
    .backdrop { position: fixed; inset: 0; background: rgb(0 0 0 / 0.3); }
    .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); inline-size: 320px; background: #fff; padding: 16px; box-sizing: border-box; }
    .top { position: sticky; top: 0; background: #fff; padding: 8px 16px; }
    .scroller { display: flex; gap: 8px; overflow-x: auto; }
    .chip { flex: 0 0 200px; background: #e4e7eb; padding: 8px; }

  </style>
</head>
<body>
<main>
  <div class="top">شريط علوي ثابت</div>
  <h1>نافذة حوار</h1>
  <div class="scroller"><div class="chip">بطاقة أولى</div><div class="chip">بطاقة ثانية</div><div class="chip">بطاقة ثالثة</div><div class="chip">بطاقة رابعة</div><div class="chip">بطاقة خامسة</div></div>
  <div class="backdrop"></div>
  <div class="modal"><p>هل تريد حذف المنتج من السلة؟</p></div>
</main>
</body>
</html>
