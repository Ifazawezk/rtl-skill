<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>fixture</title>
  <style>
    body { font: 16px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #1f2933; }
    main { max-width: 720px; margin: 0 auto; }
    .card { position: relative; background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; padding: 16px 20px; margin-block-end: 16px; }
    h1 { font-size: 24px; line-height: 1.4; margin-block: 0 16px; }
    h2 { font-size: 18px; margin-block: 0 8px; }
    table { border-collapse: collapse; inline-size: 100%; }
    th, td { text-align: start; padding: 8px; border-block-end: 1px solid #e4e7eb; }
    .opt { display: flex; gap: 8px; align-items: center; }

  </style>
</head>
<body>
<main>
  <h1>عناصر النموذج</h1>
  <div class="card">
    <progress value="30" max="100"></progress>
    <input type="range" aria-label="السعر" value="30">
    <select aria-label="المدينة"><option>الدوحة</option><option>الوكرة</option></select>
    <label class="opt"><input type="checkbox"> أوافق على الشروط</label>
    <label class="opt"><input type="radio" name="r"> الدفع عند الاستلام</label>
    <ul><li>العنصر الأول</li><li>العنصر الثاني</li></ul>
    <ol><li>الخطوة الأولى</li></ol>
    <blockquote>اقتباس بدون تنسيق خاص.</blockquote>
    <table><tr><th>المنتج</th><th>السعر</th></tr><tr><td>سماعة</td><td>١٢٠ ر.ق.</td></tr></table>
  </div>
</main>
</body>
</html>
