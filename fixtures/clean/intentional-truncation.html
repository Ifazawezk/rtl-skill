<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>fixture</title>
  <style>
    body { font: 16px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #1f2933; }
    main { max-width: 720px; margin: 0 auto; }
    .card { position: relative; background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; padding: 16px 20px; margin-block-end: 16px; }
    h1 { font-size: 24px; line-height: 1.4; margin-block: 0 16px; }
    h2 { font-size: 18px; margin-block: 0 8px; }
    .title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; inline-size: 160px; }
    .excerpt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; inline-size: 200px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

  </style>
</head>
<body>
<main>
  <h1>اقتطاع مقصود</h1>
  <div class="card">
    <p class="title">عنوان طويل جدا لا يتسع في هذا المكان الضيق أبدا مهما حاولنا</p>
    <p class="excerpt">وصف طويل يمتد على عدة أسطر ويتم اقتطاعه عند السطر الثاني بشكل مقصود لأن المساحة المتاحة في البطاقة محدودة ولا تكفي لعرض النص كاملا هنا.</p>
    <span class="sr-only">نص مخفي لقارئات الشاشة فقط يبقى طويلا</span>
  </div>
</main>
</body>
</html>
