<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>fixture</title>
  <style>
    body { font: 16px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #1f2933; }
    main { max-width: 720px; margin: 0 auto; }
    .card { position: relative; background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; padding: 16px 20px; margin-block-end: 16px; }
    h1 { font-size: 24px; line-height: 1.4; margin-block: 0 16px; }
    h2 { font-size: 18px; margin-block: 0 8px; }
    .center { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: #fff; padding: 4px 12px; }
    .wrap { position: relative; block-size: 120px; background: #e4e7eb; margin: 0 auto 16px; max-width: 480px; }
    .fill { position: absolute; left: 0; right: 0; bottom: 0; block-size: 24px; background: #cbd2d9; }
    .sym { padding: 8px 16px; margin: 4px 12px; border-left: 2px solid #999; border-right: 2px solid #999; border-radius: 6px; }

  </style>
</head>
<body>
<main>
  <h1>تخطيط متناظر</h1>
  <div class="wrap"><div class="center">في المنتصف</div><div class="fill"></div></div>
  <div class="card sym"><p>هذه البطاقة متناظرة من الجانبين.</p></div>
</main>
</body>
</html>
