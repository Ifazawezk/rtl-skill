<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>holdout</title>
  <style>
    body { font: 16px/1.6 "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; padding: 24px; background: #fafafa; color: #1f2933; }
    main { max-width: 720px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; padding: 16px 20px; margin-block-end: 16px; }
    h1 { font-size: 24px; line-height: 1.4; margin-block: 0 16px; }
    .ticker { overflow: hidden; }
    .ticker span { display: inline-block; animation: move 20s linear infinite; }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(-200px); } }

  </style>
</head>
<body>
<main>
  <h1>عاجل</h1><div class="card ticker"><span>خبر عاجل يتحرك عبر الشاشة بشكل مستمر</span></div>
</main>
</body>
</html>
